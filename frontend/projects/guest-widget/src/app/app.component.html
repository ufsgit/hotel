<!-- Loading State -->
<div *ngIf="isLoading" class="min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="flex flex-col items-center gap-4 text-slate-400">
    <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-500 rounded-full animate-spin"></div>
    <p class="text-sm font-medium">Loading hotel…</p>
  </div>
</div>

<!-- Hotel Not Found Error -->
<div *ngIf="!isLoading && hotelError" class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
  <div class="text-center max-w-sm">
    <div class="w-20 h-20 rounded-2xl bg-rose-50 text-rose-400 flex items-center justify-center mx-auto mb-5 text-4xl shadow-sm">
      🏨
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Hotel Not Found</h1>
    <p class="text-gray-500 text-sm leading-relaxed">
      We couldn't find a hotel matching your link. Please check the URL and try again, or contact the hotel directly.
    </p>
    <p class="mt-4 text-xs text-slate-400">Make sure the URL includes <code class="bg-slate-100 px-1.5 py-0.5 rounded">?hotel=&lt;slug&gt;</code></p>
  </div>
</div>

<!-- Main Widget App -->
<div *ngIf="!isLoading && !hotelError" class="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-800">
  <!-- Hotel Header -->
  <header class="glass sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3 animate-fade-in">
          <button (click)="goBack()" class="mr-2 p-2 rounded-full hover:bg-gray-100 transition-colors text-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Go Back">
            <i class="material-icons text-xl align-middle">arrow_back</i>
          </button>
          <div *ngIf="hotel?.branding_logo_url" class="h-10 w-10 rounded-full bg-white shadow-sm flex items-center justify-center p-0.5 border border-gray-200 overflow-hidden">
            <img [src]="hotel?.branding_logo_url" alt="Logo" class="h-full w-full object-cover rounded-full">
          </div>
          <div *ngIf="!hotel?.branding_logo_url" class="h-10 w-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 text-white flex items-center justify-center shadow-lg font-bold text-lg animate-float">
            H
          </div>
          <span class="font-bold text-xl text-gray-800 tracking-tight">{{ hotel?.name || 'Direct Booking' }}</span>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow container mx-auto p-4 md:p-8">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-800 text-gray-400 p-6 text-center text-sm">
    <p>&copy; 2026 {{ hotel?.name || 'Hotel' }} &mdash; Direct Booking</p>
  </footer>
</div>
