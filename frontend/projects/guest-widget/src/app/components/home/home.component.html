<!-- Active Offer Banner -->
<div *ngIf="activeOffers.length > 0" class="mb-8 rounded-xl overflow-hidden shadow-lg relative h-64 md:h-80 bg-blue-600">
  <img [src]="activeOffers[0].banner_image_url || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80'" 
       alt="Offer Banner" class="absolute inset-0 w-full h-full object-cover opacity-60">
  <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 text-white">
    <span class="bg-red-500 text-white text-xs font-bold uppercase px-3 py-1 rounded-full mb-3 shadow-md">Special Offer</span>
    <h2 class="text-3xl md:text-5xl font-bold mb-2">{{ activeOffers[0].name }}</h2>
    <p class="text-lg md:text-xl max-w-2xl">{{ activeOffers[0].description }}</p>
    <p class="mt-4 text-2xl font-semibold text-yellow-300">
      <ng-container *ngIf="activeOffers[0].discount_type === 'percent'">
        Get {{ activeOffers[0].discount_value }}% Off!
      </ng-container>
      <ng-container *ngIf="activeOffers[0].discount_type === 'flat'">
        Save ₹{{ activeOffers[0].discount_value }}!
      </ng-container>
    </p>
  </div>
</div>

<!-- Standard Hero if no offers -->
<div *ngIf="activeOffers.length === 0" class="mb-8 rounded-xl overflow-hidden shadow-lg relative h-64 md:h-80 bg-[var(--hotel-primary,theme(colors.blue.500))]">
  <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80" alt="Welcome" class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay">
  <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 text-white">
    <h2 class="text-3xl md:text-5xl font-bold mb-2">Welcome to {{ hotelName }}</h2>
    <p class="text-lg md:text-xl">Your perfect getaway starts here.</p>
  </div>
</div>

<!-- Availability Search Widget -->
<div class="bg-white rounded-xl shadow-xl p-6 -mt-12 relative z-10 mx-4 md:mx-auto max-w-5xl border border-gray-100">
  <form (ngSubmit)="searchAvailability()" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Check-in</label>
      <input type="date" [(ngModel)]="checkIn" name="checkIn" required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Check-out</label>
      <input type="date" [(ngModel)]="checkOut" name="checkOut" required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Rooms</label>
      <input type="number" [(ngModel)]="rooms" name="rooms" min="1" max="20" required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow bg-white">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Guests</label>
      <input type="number" [(ngModel)]="guests" name="guests" min="1" max="50" required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow bg-white">
    </div>

    <div>
      <button type="submit" 
              class="w-full bg-[var(--hotel-primary,theme(colors.blue.600))] hover:opacity-90 text-white font-bold py-2 px-4 rounded-lg transition-all shadow-md flex justify-center items-center h-[42px] whitespace-nowrap">
        Check Availability
      </button>
    </div>
  </form>
  
  <div class="mt-4 text-center">
    <a [routerLink]="['/my-booking']" [queryParams]="{ hotel: hotelSlug }" 
       class="text-sm font-bold text-blue-600 hover:text-blue-800 transition-colors inline-flex items-center gap-1">
      <i class="material-icons text-[16px]">receipt_long</i>
      Manage My Booking (Check Status or Cancel)
    </a>
  </div>
</div>
