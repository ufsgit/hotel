<div class="mb-6 flex justify-between items-center">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Booking Calendar</h1>
    <p class="text-gray-600 mt-1">Visualize your room occupancy over time.</p>
  </div>
</div>

<div *ngIf="isLoading" class="text-center py-10 text-gray-500">Loading calendar...</div>

<div *ngIf="!isLoading" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
  <table class="w-full text-left border-collapse min-w-[1000px]">
    <thead>
      <tr>
        <th class="p-4 border-b border-gray-200 bg-gray-50 text-sm font-semibold text-gray-700 w-48 sticky left-0 z-10">Room Type</th>
        <th *ngFor="let day of days" class="p-2 border-b border-gray-200 bg-gray-50 text-xs font-semibold text-gray-500 text-center min-w-[40px]">{{ day }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let room of rooms" class="hover:bg-gray-50">
        <td class="p-4 border-b border-gray-200 text-sm font-medium text-gray-900 sticky left-0 bg-white z-10 shadow-[1px_0_0_0_#e5e7eb]">{{ room }}</td>
        
        <td *ngFor="let day of days" class="p-1 border-b border-gray-200 border-r border-gray-100 relative h-12 text-center">
          <!-- Real booking blocks -->
          <div *ngIf="hasBooking(room, day) as booking" 
               class="absolute inset-x-1 inset-y-1 bg-blue-500 rounded text-white text-[10px] p-1 overflow-hidden whitespace-nowrap z-0 shadow-sm cursor-pointer hover:bg-blue-600"
               title="{{ booking.guest_name }} - {{ booking.booking_status }}">
            {{ booking.guest_name }}
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
