<div class="mb-6 flex justify-between items-center">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Seasons & Offers</h1>
    <p class="text-gray-600 mt-1">Manage seasonal discounts and promotional banners.</p>
  </div>
  <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm">
    + New Offer
  </button>
</div>

<div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
  <div *ngFor="let offer of offers" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
    <!-- Live Preview Banner -->
    <div class="h-32 bg-gray-900 relative">
      <img [src]="offer.banner_image_url" alt="Banner Preview" class="absolute inset-0 w-full h-full object-cover opacity-60">
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <h3 class="text-white text-2xl font-bold">{{ offer.name }}</h3>
      </div>
      <div class="absolute top-2 right-2 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded">
        Live Preview
      </div>
    </div>
    
    <div class="p-5 flex-1 flex flex-col">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 class="text-lg font-bold text-gray-900">{{ offer.name }}</h3>
          <p class="text-sm text-gray-500 mt-1">Priority: {{ offer.priority }}</p>
        </div>
        
        <!-- Toggle Switch -->
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" class="sr-only peer" [checked]="offer.is_active" (change)="toggleActive(offer)">
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
          <span class="ml-3 text-sm font-medium" [ngClass]="offer.is_active ? 'text-green-600' : 'text-gray-500'">
            {{ offer.is_active ? 'Active' : 'Inactive' }}
          </span>
        </label>
      </div>

      <div class="bg-blue-50 text-blue-800 p-3 rounded-md text-sm font-medium mb-4">
        Discount: {{ offer.discount_type === 'percent' ? offer.discount_value + '%' : '$' + offer.discount_value }}
      </div>
      
      <div class="mt-auto flex gap-2">
        <button class="flex-1 bg-white border border-gray-300 text-gray-700 py-2 rounded-md hover:bg-gray-50 transition text-sm font-medium">Edit</button>
        <button class="flex-1 bg-white border border-red-300 text-red-600 py-2 rounded-md hover:bg-red-50 transition text-sm font-medium">Delete</button>
      </div>
    </div>
  </div>
</div>
