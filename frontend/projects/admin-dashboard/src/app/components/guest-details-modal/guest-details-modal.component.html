<div *ngIf="isOpen && guest" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" (click)="closeModal()">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" (click)="$event.stopPropagation()">
    
    <div class="flex justify-between items-start mb-6 border-b border-gray-100 pb-4">
      <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <i class="material-icons text-blue-500">account_circle</i> Guest Details
      </h2>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <i class="material-icons">close</i>
      </button>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Full Name</label>
        <div class="text-sm font-medium text-gray-900">{{ guest.guest_name }}</div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Email Address</label>
        <div class="text-sm font-medium text-gray-900">{{ guest.guest_email || 'Not provided' }}</div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Phone Number</label>
        <div class="text-sm font-medium text-gray-900">{{ guest.guest_phone || 'Not provided' }}</div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Selected Room</label>
        <div class="text-sm font-medium text-gray-900">{{ guest.room_type_name || 'N/A' }}</div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Number of Guests</label>
        <div class="text-sm font-medium text-gray-900">{{ guest.num_guests }}</div>
      </div>

      <div class="pt-4 border-t border-gray-100 mt-4">
        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Guest Identity Document</label>
        
        <div *ngIf="guest.guest_document_url" class="mb-4 flex items-center justify-between p-3 bg-blue-50 border border-blue-100 rounded-lg">
          <div class="flex items-center gap-2">
            <i class="material-icons text-blue-500">description</i>
            <span class="text-sm font-medium text-blue-800">Document Uploaded</span>
          </div>
          <a [href]="guest.guest_document_url" target="_blank" class="text-xs font-bold text-blue-600 hover:text-blue-800 underline">View File</a>
        </div>

        <div class="relative">
          <input type="file" (change)="onDocumentSelected($event)" accept="image/*,application/pdf"
            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-lg">
        </div>
        
        <p *ngIf="isUploadingDoc" class="text-xs text-blue-600 mt-2 font-medium animate-pulse">Uploading document...</p>
        <p *ngIf="uploadDocError" class="text-xs text-red-500 mt-2 font-medium"><i class="material-icons text-[14px] align-text-bottom">error</i> {{ uploadDocError }}</p>
      </div>
    </div>

  </div>
</div>
